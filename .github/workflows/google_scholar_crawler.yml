name: Update Google Scholar citations

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"
  push:
    branches: [main]
    paths:
      - "_config.yml"
      - "google_scholar_crawler/**"
      - ".github/workflows/google_scholar_crawler.yml"

permissions:
  contents: write

concurrency:
  group: google-scholar-stats
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt
      - name: Install crawler dependencies
        run: python -m pip install -r google_scholar_crawler/requirements.txt
      - name: Read public Scholar counts
        run: python google_scholar_crawler/main.py --output "$RUNNER_TEMP/scholar"
      - name: Update the statistics branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin google-scholar-stats > /dev/null; then
            git fetch origin google-scholar-stats
            git checkout -B google-scholar-stats FETCH_HEAD
          else
            git switch --orphan google-scholar-stats
          fi
          cp "$RUNNER_TEMP/scholar/gs_data.json" .
          cp "$RUNNER_TEMP/scholar/gs_data_shieldsio.json" .
          git add gs_data.json gs_data_shieldsio.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update Google Scholar citation counts"
          git push origin HEAD:google-scholar-stats
