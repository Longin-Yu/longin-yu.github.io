<script src="{{ '/assets/scholar.js' | relative_url }}" defer
  data-scholar-id="{{ site.google_scholar_id | escape }}"
  data-updated="{{ site.data.scholar.updated | escape }}"
  data-snapshot-url="{{ '/assets/data/gs_data.json' | relative_url }}"
  {% if site.google_scholar_stats_use_cdn %}
  data-remote-url="https://cdn.jsdelivr.net/gh/{{ site.repository }}@google-scholar-stats/gs_data.json"
  {% else %}
  data-remote-url="https://raw.githubusercontent.com/{{ site.repository }}/google-scholar-stats/gs_data.json"
  {% endif %}
></script>
